spring:
  application:
    name: hotel-booking-backend

  # --- Default profile: in-memory H2, zero setup, great for running the demo ---
  datasource:
    url: jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

redisson:
  enabled: false   # flip to true + have a redis instance to use true distributed locking across nodes

server:
  port: 8080

logging:
  level:
    com.hotelbooking: INFO

---
# --- Production profile: Postgres + Redis-backed distributed locks ---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hoteldb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

redisson:
  enabled: true
