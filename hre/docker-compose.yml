version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: hotel-postgres
    environment:
      POSTGRES_PASSWORD: hotel123
      POSTGRES_DB: hotel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: hotel-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
